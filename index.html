<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Center Portal</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-hover: #5b4bc4;
            --primary-light: #a29bfe;
            --accent-green: #00b894;
            --bg-dark: #0f1123;
            --card-glass: rgba(255, 255, 255, 0.08);
            --card-glass-border: rgba(255, 255, 255, 0.15);
            --dashboard-bg: #f5f6fa;
            --sidebar-bg: #4834d4;
            --text-dark: #2d3436;
            --text-light: #f5f6fa;
            --text-muted: #a4b0be;
            --card-white: #ffffff;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Helper Classes */
        .hidden {
            display: none !important;
        }

        /* -------------------------------------------------------------
           AUTH / LANDING VIEW (GLASSMORPHISM STYLE)
        ------------------------------------------------------------- */
        .auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e0036 0%, #0c0827 50%, #1a103c 100%);
            position: relative;
            padding: 20px;
        }

        /* Background Animated Glows */
        .auth-container::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.4) 0%, rgba(0,0,0,0) 70%);
            top: 10%;
            left: 15%;
            border-radius: 50%;
            filter: blur(50px);
        }

        .auth-container::after {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(162, 155, 254, 0.3) 0%, rgba(0,0,0,0) 70%);
            bottom: 10%;
            right: 15%;
            border-radius: 50%;
            filter: blur(50px);
        }

        .auth-card {
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-glass-border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 460px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            z-index: 10;
            transition: var(--transition);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header i {
            font-size: 2.5rem;
            color: var(--primary-light);
            margin-bottom: 12px;
        }

        .auth-header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 6px;
        }

        /* Auth Tabs Switcher */
        .auth-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px;
            border-radius: var(--radius-md);
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 14px 16px 14px 45px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-glass-border);
            border-radius: var(--radius-md);
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary-light);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 15px rgba(162, 155, 254, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: #ffffff;
            color: var(--bg-dark);
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.2);
            background: #f0f0f0;
        }

        .auth-message {
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
        }

        .auth-message.error { color: #ff7675; }
        .auth-message.success { color: #55efc4; }

        /* -------------------------------------------------------------
           DASHBOARD VIEW (LIGHT MODERN UI)
        ------------------------------------------------------------- */
        .dashboard-container {
            display: flex;
            min-height: 100vh;
            background-color: var(--dashboard-bg);
            color: var(--text-dark);
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #ffffff;
            border-top-right-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 10px 0 30px rgba(72, 52, 212, 0.15);
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.3rem;
            font-weight: 700;
            padding-left: 10px;
            margin-bottom: 40px;
        }

        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .badge {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.25);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        /* Main Content Area */
        .main-wrapper {
            flex: 1;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Top Header Bar */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .page-title h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2d3436;
        }

        .top-nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .search-bar {
            position: relative;
        }

        .search-bar input {
            padding: 10px 16px 10px 40px;
            border: none;
            background: #ffffff;
            border-radius: 20px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            width: 220px;
            font-size: 0.88rem;
        }

        .search-bar i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .profile-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            padding: 6px 14px 6px 6px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* Content Dashboard Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        .grid-card {
            background: var(--card-white);
            border-radius: var(--radius-lg);
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
        }

        /* Profile Banner Section */
        .profile-card {
            display: flex;
            align-items: center;
            gap: 25px;
            background: #ffffff;
        }

        .profile-avatar-lg {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
        }

        .profile-info h3 {
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .profile-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 3px;
        }

        /* Capacity / Slots Card */
        .capacity-card {
            background: linear-gradient(135deg, #6c5ce7, #4834d4);
            color: white;
        }

        .capacity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.2);
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar-fill {
            background: var(--accent-green);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Tables & Lists */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .student-table {
            width: 100%;
            border-collapse: collapse;
        }

        .student-table th {
            text-align: left;
            padding: 12px 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-bottom: 1px solid #edf2f7;
        }

        .student-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #edf2f7;
            font-size: 0.9rem;
        }

        .badge-slot {
            background: #e0e7ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .dashboard-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <!-- -------------------------------------------------------------
         SECTION 1: AUTHENTICATION LANDING VIEW
    ------------------------------------------------------------- -->
    <div id="authView" class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-graduation-cap"></i>
                <h1>Welcome Back!</h1>
                <p>Sign in or create an account to access the center portal</p>
            </div>

            <!-- Auth Tabs -->
            <div class="auth-tabs">
                <button class="tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">Log In</button>
                <button class="tab-btn" id="tabSignup" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Full Name or ID</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="loginInput" class="form-control" placeholder="Enter your registered name or ID" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Log In</button>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signupForm" class="hidden" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user-plus"></i>
                        <input type="text" id="signupName" class="form-control" placeholder="Enter full name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-calendar"></i>
                        <input type="number" id="signupAge" class="form-control" placeholder="Enter age" min="5" max="100" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>

    <!-- -------------------------------------------------------------
         SECTION 2: LOGGED-IN DASHBOARD VIEW
    ------------------------------------------------------------- -->
    <div id="dashboardView" class="dashboard-container hidden">
        
        <!-- Navigation Sidebar -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-brand">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>SUCCESS</span>
                </div>
                <ul class="sidebar-menu">
                    <li><a href="#" class="nav-item active"><i class="fa-solid fa-user"></i> Profile</a></li>
                    <li><a href="#" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Capacity <span class="badge" id="sidebarBadge">0/20</span></a></li>
                </ul>
            </div>
            <div>
                <a href="#" class="nav-item" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <main class="main-wrapper">
            <!-- Top Navbar -->
            <header class="top-navbar">
                <div class="page-title">
                    <h2>Dashboard</h2>
                </div>
                <div class="top-nav-actions">
                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" onkeyup="filterStudents()" placeholder="Search student by name or ID...">
                    </div>
                    <div class="profile-btn">
                        <div class="avatar" id="navAvatar">U</div>
                        <span id="navName" style="font-weight: 600; font-size: 0.9rem;">User</span>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content Grid -->
            <div class="dashboard-grid">
                
                <!-- Left Column -->
                <div style="display: flex; flex-direction: column; gap: 25px;">
                    
                    <!-- Profile Details Box -->
                    <div class="grid-card profile-card">
                        <div class="profile-avatar-lg" id="profileAvatar">U</div>
                        <div class="profile-info">
                            <h3 id="profileName">Student Name</h3>
                            <p id="profileId"><i class="fa-solid fa-id-card"></i> Student ID: #00</p>
                            <p id="profileAge"><i class="fa-solid fa-user-clock"></i> Age: --</p>
                        </div>
                    </div>

                    <!-- All Registered Students List -->
                    <div class="grid-card">
                        <div class="section-header">
                            <h3>Registered Student Slots</h3>
                        </div>
                        <table class="student-table">
                            <thead>
                                <tr>
                                    <th>SLOT ID</th>
                                    <th>NAME</th>
                                    <th>AGE</th>
                                </tr>
                            </thead>
                            <tbody id="studentTableBody">
                                <!-- Dynamic JavaScript Content -->
                            </tbody>
                        </table>
                    </div>

                </div>

                <!-- Right Column -->
                <div style="display: flex; flex-direction: column; gap: 25px;">
                    
                    <!-- Slot Capacity Metric -->
                    <div class="grid-card capacity-card">
                        <div class="capacity-header">
                            <h4>Center Allocation</h4>
                            <i class="fa-solid fa-server"></i>
                        </div>
                        <h2 id="capacityRatio" style="font-size: 2rem; margin-bottom: 10px;">0 / 20</h2>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="capacityProgress"></div>
                        </div>
                        <p id="capacityDetails" style="font-size: 0.85rem; opacity: 0.9;">Available Slots: 20</p>
                    </div>

                </div>

            </div>
        </main>
    </div>

    <!-- -------------------------------------------------------------
         SECTION 3: JAVASCRIPT LOGIC
    ------------------------------------------------------------- -->
    <script>
        const MAX_SLOTS = 20;
        let students = [];
        let activeUser = null;

        // Initialize application on page load
        window.onload = function() {
            loadStudentsFromStorage();
        };

        // Local Storage Handler
        function loadStudentsFromStorage() {
            const stored = localStorage.getItem('students_db');
            if (stored) {
                students = JSON.parse(stored);
            }
        }

        function saveStudentsToStorage() {
            localStorage.setItem('students_db', JSON.stringify(students));
        }

        // Tab Switcher Logic
        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabSignup = document.getElementById('tabSignup');
            const authMessage = document.getElementById('authMessage');

            authMessage.innerText = '';

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                tabLogin.classList.remove('active');
                tabSignup.classList.add('active');
            }
        }

        // Sign Up Handler
        function handleSignup(event) {
            event.preventDefault();
            const authMessage = document.getElementById('authMessage');

            if (students.length >= MAX_SLOTS) {
                authMessage.className = 'auth-message error';
                authMessage.innerText = 'Registration Full! All 20 student slots are assigned.';
                return;
            }

            const nameInput = document.getElementById('signupName').value.trim();
            const ageInput = parseInt(document.getElementById('signupAge').value);

            // Auto-assign next ID sequentially
            const nextId = students.length > 0 ? Math.max(...students.map(s => s.st_id)) + 1 : 1;

            const newStudent = {
                st_id: nextId,
                name: nameInput,
                age: ageInput
            };

            students.push(newStudent);
            saveStudentsToStorage();

            authMessage.className = 'auth-message success';
            authMessage.innerText = `Account created successfully! Assigned ID: #${String(nextId).padStart(2, '0')}`;
            
            document.getElementById('signupForm').reset();
            setTimeout(() => { switchAuthTab('login'); }, 1500);
        }

        // Log In Handler
        function handleLogin(event) {
            event.preventDefault();
            const query = document.getElementById('loginInput').value.trim().toLowerCase();
            const authMessage = document.getElementById('authMessage');

            const match = students.find(st => 
                st.name.toLowerCase() === query || String(st.st_id) === query
            );

            if (match) {
                activeUser = match;
                renderDashboard();
                document.getElementById('authView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
            } else {
                authMessage.className = 'auth-message error';
                authMessage.innerText = 'Account not found! Please check your name or ID.';
            }
        }

        // Dashboard Rendering Logic
        function renderDashboard() {
            if (!activeUser) return;

            // Nav & Profile Setup
            document.getElementById('navName').innerText = activeUser.name;
            document.getElementById('navAvatar').innerText = activeUser.name.charAt(0).toUpperCase();
            document.getElementById('profileAvatar').innerText = activeUser.name.charAt(0).toUpperCase();
            document.getElementById('profileName').innerText = activeUser.name;
            document.getElementById('profileId').innerHTML = `<i class="fa-solid fa-id-card"></i> Student ID: #${String(activeUser.st_id).padStart(2, '0')}`;
            document.getElementById('profileAge').innerHTML = `<i class="fa-solid fa-user-clock"></i> Age: ${activeUser.age}`;

            // Capacity Metrics Update
            const count = students.length;
            const percentage = (count / MAX_SLOTS) * 100;
            document.getElementById('capacityRatio').innerText = `${count} / ${MAX_SLOTS}`;
            document.getElementById('capacityProgress').style.width = `${percentage}%`;
            document.getElementById('capacityDetails').innerText = `Available Slots: ${MAX_SLOTS - count}`;
            document.getElementById('sidebarBadge').innerText = `${count}/${MAX_SLOTS}`;

            // Render Table
            renderStudentTable(students);
        }

        function renderStudentTable(list) {
            const tableBody = document.getElementById('studentTableBody');
            tableBody.innerHTML = '';

            if (list.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">No student records found.</td></tr>`;
                return;
            }

            list.forEach(st => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="badge-slot">Slot #${String(st.st_id).padStart(2, '0')}</span></td>
                    <td style="font-weight: 600;">${st.name}</td>
                    <td>${st.age} years old</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Live Table Search Filter
        function filterStudents() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = students.filter(st => 
                st.name.toLowerCase().includes(searchTerm) || String(st.st_id).includes(searchTerm)
            );
            renderStudentTable(filtered);
        }

        // Logout Handler
        function handleLogout() {
            activeUser = null;
            document.getElementById('loginInput').value = '';
            document.getElementById('authMessage').innerText = '';
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('authView').classList.remove('hidden');
            switchAuthTab('login');
        }
    </script>
</body>
</html>
